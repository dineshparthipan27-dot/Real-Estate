<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DreamHomes</title>
     
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
         
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #FFFFFF;  
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

         
        .bg-element {
            position: absolute;
            color: rgba(15, 44, 89, 0.02);  
            z-index: 1;
        }

        .bg-house { font-size: 40rem; top: 50%; left: 50%; transform: translate(-50%, -50%); }

         
        .error-container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

         
        .error-code {
            font-size: 12rem;
            font-weight: 900;
            color: #0F2C59;
            line-height: 1;
            letter-spacing: -5px;
            margin-bottom: 20px;
            text-shadow: 10px 10px 0px rgba(232, 200, 114, 0.2);
            animation: float404 4s ease-in-out infinite;
        }

        .error-code span { color: #E8C872; }  

        @keyframes float404 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

         
        .error-title {
            font-size: 2.5rem;
            color: #0F2C59;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-desc {
            font-size: 1.15rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

         
        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

         
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0F2C59;
            color: #FFFFFF;
            padding: 16px 40px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 25px rgba(15, 44, 89, 0.2);
        }

        .btn-home:hover {
            background: #E8C872;
            color: #0F2C59;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(232, 200, 114, 0.3);
        }

        .btn-home i { color: #E8C872; transition: all 0.3s ease; }
        .btn-home:hover i { color: #0F2C59; }

         
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: #0F2C59;
            border: 2px solid rgba(15, 44, 89, 0.2);
            padding: 16px 40px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
        }

        .btn-back:hover {
            border-color: #0F2C59;
            background: rgba(15, 44, 89, 0.05);
            transform: translateY(-5px);
        }

         
        @media (max-width: 768px) {
            .error-code { font-size: 8rem; }
            .error-title { font-size: 1.8rem; }
            .bg-house { font-size: 20rem; }
            .error-actions { flex-direction: column; width: 100%; max-width: 300px; margin: 0 auto; }
            .btn-home, .btn-back { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

     
    <i class="fa-solid fa-house-circle-exclamation bg-element bg-house"></i>

    <div class="error-container">
         
        <div class="error-code">4<span>0</span>4</div>
        
        <h2 class="error-title">Property Not Found</h2>
        
        <p class="error-desc">
            Oops! It looks like this page is off the market. The link you followed might be broken, or the page may have been moved.
        </p>
        
        <div class="error-actions">
             
            <button onclick="goBack()" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>
            
             
            <a href="index.html" class="btn-home">
                Go to Home <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </div>

     
    <script>
        function goBack() {
 
            if (window.history.length > 1) {
                window.history.back(); // Goes back to the previous page
            } else {
 
                window.location.href = "index.html"; 
            }
        }
    </script>

</body>
</html>
